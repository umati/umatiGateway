---
name: build

on:
  push:
    branches: [main, develop, hackathon]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  merge_group:

permissions: read-all

jobs:
  docker:
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    env:
      # Use docker.io for Docker Hub if empty
      REGISTRY: ghcr.io
      # github.repository as <account>/<repo>
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          path: umatiGateway
          persist-credentials: false

      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.8.0
        #if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver-opts: network=host

      - name: Build and Push container image to ${{ env.REGISTRY }}
        uses: docker/build-push-action@v7.4.0
        #if: github.event_name != 'pull_request'
        with:
          context: ./umatiGateway
          file: ./umatiGateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Build and Push container image to local registry
        uses: docker/build-push-action@v7.4.0
        if: github.event_name == 'pull_request'
        with:
          context: ./umatiGateway
          file: ./umatiGateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: localhost:5000/umati/umatigateway:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Run integration test mqtt
        if: github.event_name == 'pull_request'
        run: |
          #!/bin/bash
          cd ./umatiGateway/tests/integration/mqtt_test || exit
          docker compose up -d
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ./waitForContainer.sh
          python -m unittest discover test_mqtt_sampleserver
